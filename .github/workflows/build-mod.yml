name: Build Minecraft mod

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "Path (inside this repo) to the uploaded project zip"
        required: true
      loader:
        description: "fabric | forge | neoforge"
        required: true
      mc_version:
        description: "Minecraft version, e.g. 1.20.4"
        required: true
      release_tag:
        description: "Tag used for the GitHub Release that will carry the built jar"
        required: true

jobs:
  build-mod:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Pick template repo + branch for the chosen loader/version
        id: template
        run: |
          MC="${{ inputs.mc_version }}"
          MAJOR_MINOR=$(echo "$MC" | cut -d. -f1,2)
          case "${{ inputs.loader }}" in
            fabric)
              echo "repo=https://github.com/FabricMC/fabric-example-mod" >> "$GITHUB_OUTPUT"
              ;;
            forge)
              echo "repo=https://github.com/MinecraftForge/MDK" >> "$GITHUB_OUTPUT"
              ;;
            neoforge)
              echo "repo=https://github.com/neoforged/MDK" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown loader: ${{ inputs.loader }}"
              exit 1
              ;;
          esac
          echo "branch_candidates=$MC $MAJOR_MINOR main master" >> "$GITHUB_OUTPUT"

      - name: Clone the closest matching loader template
        run: |
          set -e
          REPO="${{ steps.template.outputs.repo }}"
          mkdir mod-workdir
          FOUND=0
          for BR in ${{ steps.template.outputs.branch_candidates }}; do
            if git clone --depth 1 --branch "$BR" "$REPO" mod-workdir 2>/dev/null; then
              echo "Cloned branch $BR"
              FOUND=1
              break
            fi
            rm -rf mod-workdir
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "Could not find a matching branch for MC ${{ inputs.mc_version }}; cloning default branch."
            git clone --depth 1 "$REPO" mod-workdir
          fi

      - name: Overlay the user's project on top of the template
        run: |
          set -e
          UNZIP_DIR="incoming-project"
          mkdir -p "$UNZIP_DIR"
          unzip -o "${{ inputs.zip_path }}" -d "$UNZIP_DIR"
          # If the zip contains one top-level folder, treat its contents as the project root.
          ENTRIES=$(ls "$UNZIP_DIR")
          COUNT=$(echo "$ENTRIES" | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "$UNZIP_DIR/$ENTRIES" ]; then
            SRC="$UNZIP_DIR/$ENTRIES"
          else
            SRC="$UNZIP_DIR"
          fi
          cp -rf "$SRC"/. mod-workdir/
          echo "Overlay complete."

      - name: Set Minecraft version in template gradle.properties (best effort)
        run: |
          cd mod-workdir
          if [ -f gradle.properties ]; then
            sed -i "s/^minecraft_version=.*/minecraft_version=${{ inputs.mc_version }}/" gradle.properties || true
          fi

      - name: Build with Gradle
        run: |
          cd mod-workdir
          chmod +x gradlew || true
          test -f gradlew || gradle wrapper --gradle-version 8.7
          ./gradlew build --no-daemon

      - name: Find built jar
        id: jar
        run: |
          JAR=$(find mod-workdir -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n1)
          if [ -z "$JAR" ]; then
            echo "No jar found in build/libs" >&2
            exit 1
          fi
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish jar as a GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: "Mod build ${{ inputs.release_tag }}"
          files: ${{ steps.jar.outputs.jar_path }}
          body: "Loader: ${{ inputs.loader }} | MC: ${{ inputs.mc_version }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
